name: CI

# Corre em qualquer branch de trabalho e, obrigatoriamente, nos pull requests
# para quality (QA) e production. Nenhum merge para QA deve ser feito sem este
# workflow verde. Ver CLAUDE.md, seccao 5.
on:
  push:
    branches-ignore:
      - production
  pull_request:
    branches:
      - quality
      - production

# Um push novo na mesma branch cancela a execucao anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 24 para acompanhar a versao usada pelos projetos na Vercel.
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # Necessario para os testes das Edge Functions em supabase/functions.
      - name: Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Vitest (frontend, ambas as superficies) e deno test (edge functions).
      - name: Testes
        run: npm run test

      # Sem variaveis VITE_*, para confirmar que a build nao depende delas e que
      # a diretiva robots continua a falhar fechada em noindex,nofollow.
      - name: Build
        run: npm run build
